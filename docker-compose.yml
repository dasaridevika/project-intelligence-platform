services:
  postgres:
    image: postgres:16-alpine
    container_name: project-intel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: project_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project-intel-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project-intel-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/project_intelligence
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/project_intelligence
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=secure_development_secret_key_minimum_64_characters_long_1234567890
      - INTERNAL_API_KEY=production_conscious_internal_service_key_987654321
      - EXA_API_KEY=${EXA_API_KEY:-}
      - SECOND_PROVIDER_API_KEY=${SECOND_PROVIDER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: project-intel-consumer
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/project_intelligence
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/project_intelligence
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_API_KEY=production_conscious_internal_service_key_987654321
      - EXA_API_KEY=${EXA_API_KEY:-}
      - SECOND_PROVIDER_API_KEY=${SECOND_PROVIDER_API_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
