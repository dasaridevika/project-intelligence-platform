services:
  - type: web
    name: project-intelligence-platform
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./project_intelligence.db
      - key: SECRET_KEY
        generateValue: true
      - key: EXA_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
