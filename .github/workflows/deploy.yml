name: Build & Verify Edge Application

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-edge-worker:
    name: Verify Edge AI Worker (index.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Edge Worker Syntax
        run: |
          node -c cloudflare/gateway/index.js

  build-frontend:
    name: Build Frontend Production Bundle
    needs: verify-edge-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build
