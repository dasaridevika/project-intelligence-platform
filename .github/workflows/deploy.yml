name: Test & Build with GitHub Secrets

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Test Suite with Search API Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          SECOND_PROVIDER_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
        run: |
          cd backend
          pytest tests/test_suite.py -v --tb=short

  build-frontend:
    name: Build Frontend Bundle
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm ci
          npm run build
