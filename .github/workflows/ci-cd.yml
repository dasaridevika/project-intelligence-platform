name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-backend:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Pytest Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SECOND_PROVIDER_API_KEY: ${{ secrets.SECOND_PROVIDER_API_KEY }}
        run: |
          cd backend
          pytest tests/ -v --tb=short

  build-and-deploy:
    name: Build Frontend & Deploy to Cloudflare
    needs: test-backend
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy API Gateway & Static Assets to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiAuthentication: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/gateway
          command: deploy

      - name: Deploy Scheduled Outbox Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiAuthentication: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/scheduler
          command: deploy
